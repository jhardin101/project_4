<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Library</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Game Library</h1>
            <p>Collection Area</p>
        <h1>Add a New Game</h1>
            <form>
                Title: <input type="text" name="title" size="15"><br>
                Platfrom: <input type="text" name="platform" size="15"><br>
                Genre: <input type="text" name="genre" size="15"><br>
                Release Year: <input type="text" name="release_year" size="15"><br>
                Status: <input type="text" name="status" size="15"><br>
                Rating: <input type="text" name="rating" size="15"><br>
                Notes: <input type="text" name="notes" size="15"><br>
                <input type="submit" value="Submit"><br>
                <input type="reset" value="Clear"><br>
            </form>
    </body>
</html>
