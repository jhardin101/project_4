<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Library</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>Game Library</h1>
            <section>
                <h2>Collection:</h2>
                <p>No games here!</p>
                <ul id="collection_list">

                </ul>
            </section>
            
            <h2>Add a New Game</h2>
                <form id="game_form">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" size="15" required><br>
                    <label for="platform">Platform:</label>
                    <input type="text" id="platform" name="platform" size="15" required><br>
                    <label for="genre">Genre:</label>
                    <input type="text" id="genre" name="genre" size="15" required><br>
                    <label for="release_year">Release Year:</label>
                    <input type="number" id="release_year" name="release_year" size="15" required><br>
                    <label for="status">Status:</label>
                    <select id="status" name="status" required>
                        <option>Backlog</option>
                        <option>Playing</option>
                        <option>Completed</option>
                    </select><br>
                    <label for="rating">Rating(Optional):</label>
                    <input type="range" id="rating" name="rating" size="15" min="1" max="5" step="1"><br>
                    <label for="notes">Notes(Optional):</label>
                    <input type="text" id="notes" name="notes" size="15"><br>
                    <input type="submit" value="Submit"><br>
                    <input type="reset" value="Clear"><br>
                </form>
    </body>
</html>
