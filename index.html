<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Library</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <h1>
            <svg class="title-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6.5 8h11a4.5 4.5 0 0 1 4.4 5.4l-.7 3.2a2 2 0 0 1-3.3 1l-2.1-1.8H8.2l-2.1 1.8a2 2 0 0 1-3.3-1l-.7-3.2A4.5 4.5 0 0 1 6.5 8Z"
                    fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linejoin="round"/>
                <path d="M7 11v4M5 13h4" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="16.5" cy="12" r="1" fill="currentColor"/>
                <circle cx="18.5" cy="14" r="1" fill="currentColor"/>
            </svg>
            Game Library
        </h1>
            <section>
                <h2>Collection:</h2>
                <p id="empty_list_msg">No games here!</p>
                <ul id="collection_list">

                </ul>
            </section>
            
            <h2 id="form_heading">Add a New Game</h2>
                <form id="game_form">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" size="15" required><br>
                    <label for="platform">Platform:</label>
                    <input type="text" id="platform" name="platform" size="15" required><br>
                    <label for="genre">Genre:</label>
                    <input type="text" id="genre" name="genre" size="15" required><br>
                    <label for="release_year">Release Year:</label>
                    <input type="number" id="release_year" name="release_year" size="15" min="1958" required><br>
                    <label for="status">Status:</label>
                    <select id="status" name="status" required>
                        <option value="" disabled selected>Choose a status...</option>
                        <option value="Backlog">Backlog</option>
                        <option value="Playing">Playing</option>
                        <option value="Completed">Completed</option>
                    </select><br>
                    <label for="rating">Rating(Optional):</label>
                    <input type="number" id="rating" name="rating" size="15" min="1" max="5"><br>
                    <label for="notes">Notes(Optional):</label>
                    <textarea id="notes" name="notes" rows="" cols=""></textarea><br>
                    <input id="submit_button" type="submit" value="Add Game"><br>
                    <input type="reset" value="Clear"><br>
                </form>
    </body>
</html>
